name: publish OCI release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  quality:
    name: exact-tag quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: ./scripts/bootstrap.sh
      - name: Verify release tag matches package version
        run: uv run python scripts/verify-release-tag.py "$GITHUB_REF_NAME"
      - run: make check

  publish:
    name: publish signed Linux amd64 image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: bobbravo2/reefproof
      SOURCE_URL: https://github.com/bobbravo2/ReefProof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: created
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.created.outputs.value }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SOURCE=${{ env.SOURCE_URL }}
            REVISION=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            CREATED=${{ steps.created.outputs.value }}
      - name: Generate SPDX 2.3 SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output: reefproof.spdx.json
          exit-code: "0"
      - name: Scan image for release-blocking vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: json
          output: reefproof.vulnerabilities.json
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reefproof-supply-chain-${{ github.sha }}
          path: |
            reefproof.spdx.json
            reefproof.vulnerabilities.json
          if-no-files-found: error
      - name: Push verified image
        id: push
        run: |
          docker push --all-tags "${REGISTRY}/${IMAGE_NAME}"
          digest="$(docker image inspect "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SPDX SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: reefproof.spdx.json
          push-to-registry: true
      - name: Publish release receipt
        run: |
          {
            printf '## ReefProof %s\n\n' "$GITHUB_REF_NAME"
            printf '%s\n\n' 'Read-only configuration assurance for living systems.'
            printf '%s\n' '| Release evidence | Verified reference |'
            printf '%s\n' '| --- | --- |'
            # GitHub Actions resolves this expression before the shell runs.
            # shellcheck disable=SC2016
            printf '| OCI image | `%s@%s` |\n' "${REGISTRY}/${IMAGE_NAME}" "${{ steps.push.outputs.digest }}"
            printf '%s\n' '| Platform | Linux amd64 |'
            # Markdown backticks are intentional literal receipt formatting.
            # shellcheck disable=SC2016
            printf '| Source | [`%s`](https://github.com/%s/commit/%s) |\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Supply-chain evidence | [SPDX 2.3 SBOM and Trivy HIGH/CRITICAL report](https://github.com/%s/actions/runs/%s) |\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s\n' 'Deploy the immutable OCI digest above; tags are for discovery only.'
          } >> "$GITHUB_STEP_SUMMARY"
