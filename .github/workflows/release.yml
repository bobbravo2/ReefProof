name: publish OCI release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  quality:
    name: exact-tag quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: ./scripts/bootstrap.sh
      - name: Verify release tag matches package version
        run: uv run python scripts/verify-release-tag.py "$GITHUB_REF_NAME"
      - run: make check

  publish:
    name: publish signed Linux amd64 image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: bobbravo2/reefproof
      SOURCE_URL: https://github.com/bobbravo2/ReefProof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: created
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.created.outputs.value }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SOURCE=${{ env.SOURCE_URL }}
            REVISION=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            CREATED=${{ steps.created.outputs.value }}
      - name: Generate SPDX 2.3 SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output: reefproof.spdx.json
          exit-code: "0"
      - name: Scan image for release-blocking vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: json
          output: reefproof.vulnerabilities.json
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reefproof-supply-chain-${{ github.sha }}
          path: |
            reefproof.spdx.json
            reefproof.vulnerabilities.json
          if-no-files-found: error
      - name: Push verified image
        id: push
        run: |
          docker push --all-tags "${REGISTRY}/${IMAGE_NAME}"
          digest="$(docker image inspect "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: reefproof.spdx.json
          push-to-registry: true
      - name: Publish release receipt
        run: |
          receipt="reefproof-release.md"
          {
            printf '## ReefProof %s\n\n' "$GITHUB_REF_NAME"
            printf '%s\n\n' 'Read-only configuration assurance for living systems.'
            printf '%s\n' '| Release evidence | Verified reference |'
            printf '%s\n' '| --- | --- |'
            # GitHub Actions resolves this expression before the shell runs.
            # shellcheck disable=SC2016
            printf '| OCI image | `%s@%s` |\n' "${REGISTRY}/${IMAGE_NAME}" "${{ steps.push.outputs.digest }}"
            printf '%s\n' '| Platform | Linux amd64 |'
            # Markdown backticks are intentional literal receipt formatting.
            # shellcheck disable=SC2016
            printf '| Source | [`%s`](https://github.com/%s/commit/%s) |\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Supply-chain evidence | [SPDX 2.3 SBOM and Trivy HIGH/CRITICAL report](https://github.com/%s/actions/runs/%s) |\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s\n' 'Deploy the immutable OCI digest above; tags are for discovery only.'
          } > "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release with supply-chain evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            reefproof-release.md#release-receipt.md \
            reefproof.spdx.json#reefproof.spdx.json \
            reefproof.vulnerabilities.json#reefproof.vulnerabilities.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ReefProof $GITHUB_REF_NAME" \
            --notes-file reefproof-release.md \
            --latest
