name: delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: delivery-quality
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: ./scripts/bootstrap.sh
      - run: make check

  binary:
    name: standalone CLI (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: delivery-binary-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: ./scripts/build-binary.sh
      - run: tar -C dist -czf reefproof-${{ runner.os }}-${{ runner.arch }}.tar.gz reefproof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reefproof-${{ runner.os }}-${{ runner.arch }}
          path: reefproof-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error

  desktop:
    name: unsigned macOS desktop app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: delivery-desktop
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: make test/desktop
      - run: make build/desktop-app
      - name: Archive unsigned application bundle
        run: |
          app="dist/desktop/ReefProof-darwin-$(node -p 'process.arch')/ReefProof.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "reefproof-desktop-${RUNNER_OS}-${RUNNER_ARCH}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reefproof-desktop-${{ runner.os }}-${{ runner.arch }}
          path: reefproof-desktop-${{ runner.os }}-${{ runner.arch }}.zip
          if-no-files-found: error

  container:
    name: OCI image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker build --load --tag reefproof:test
          --build-arg SOURCE="https://github.com/bobbravo2/ReefProof"
          --build-arg REVISION="${{ github.sha }}"
          --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - run: >-
          docker run --rm --read-only --network=none --cap-drop=all
          --tmpfs /tmp:rw,noexec,nosuid,nodev reefproof:test version
      - run: >-
          docker run --rm --read-only --network=none --cap-drop=all
          --tmpfs /tmp:rw,noexec,nosuid,nodev reefproof:test doctor
      - run: docker volume create reefproof-test-data
      - run: >-
          docker run --rm --read-only --network=none --cap-drop=all
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --mount source=reefproof-test-data,target=/var/lib/reefproof
          reefproof:test infra-smoke --format json
      - run: >-
          docker run --rm --read-only --network=none --cap-drop=all
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --mount source=reefproof-test-data,target=/var/lib/reefproof
          reefproof:test infra-smoke --format json
      - run: docker volume rm reefproof-test-data
      - run: test "$(docker image inspect reefproof:test --format '{{.Config.User}}')" = reefproof
      - run: test "$(docker image inspect reefproof:test --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/bobbravo2/ReefProof"
      - run: test "$(docker image inspect reefproof:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${{ github.sha }}"
